{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-6">
        <div class="card shadow">
            <div class="card-header bg-dark text-white">Ingreso al Sistema</div>
            <div class="card-body">
                <form action="/login" method="POST">
                    <div class="mb-3">
                        <label class="form-label">Seleccionar Perfil:</label>
                        <select name="perfil" class="form-select">
                            <option value="admin">Administrador (Consultora)</option>
                            {% for c in clientes %}
                            <option value="{{ c.id }}">Cliente: {{ c.nombre }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Ingresar</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
